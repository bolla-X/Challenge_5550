<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>VisionEPI · Câmera do celular</title>
<style>
  :root { --canvas:#F5F5F7; --surface:#FFFFFF; --text:#1A1A1C; --text-2:#5E5E64; --hairline:#E5E5EA;
          --accent:#0A66C2; --on-accent:#FFFFFF; --ok:#16794A; --danger:#AF4606; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  h1 { font-size: 20px; margin: 4px 0 0; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--text-2); }
  .quadro { background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 9; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  button { height: 48px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent);
           font: inherit; font-weight: 600; }
  button:disabled { opacity: .5; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .estado { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--hairline);
            border-radius: 12px; padding: 12px 14px; }
  .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--text-2); flex: none; }
  .estado[data-estado="enviando"] .ponto { background: var(--ok); }
  .estado[data-estado="erro"] .ponto { background: var(--danger); }
  small { color: var(--text-2); }
</style>
</head>
<body>
<main>
  <div>
    <h1>Câmera do celular</h1>
    <p>Este celular vira uma câmera do VisionEPI enquanto esta página estiver aberta.</p>
  </div>
  <div class="quadro"><video id="video" playsinline muted></video></div>
  <button id="iniciar" type="button">Iniciar câmera</button>
  <div class="estado" id="estado" data-estado="parado" role="status" aria-live="polite">
    <span class="ponto"></span><span id="texto">Parado</span>
  </div>
  <small>Só a imagem é enviada, para o servidor desta rede. Nada fica gravado no celular.</small>
</main>
<script>
(() => {
  const token = new URLSearchParams(location.search).get("t") || "";
  const video = document.getElementById("video");
  const botao = document.getElementById("iniciar");
  const estado = document.getElementById("estado");
  const texto = document.getElementById("texto");
  const canvas = document.createElement("canvas");
  let enviados = 0;
  let rodando = false;

  function mostrar(chave, mensagem) {
    estado.dataset.estado = chave;
    texto.textContent = mensagem;
  }

  if (!token) {
    mostrar("erro", "Link incompleto: abra pelo QR code da tela da câmera.");
    botao.disabled = true;
    return;
  }
  // Contexto seguro é obrigatório para getUserMedia (MDN): em http:// por IP
  // de rede, navigator.mediaDevices nem existe.
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    mostrar("erro", "Esta página precisa abrir em HTTPS para usar a câmera.");
    botao.disabled = true;
    return;
  }

  async function enviarQuadro() {
    if (!rodando) return;
    if (video.videoWidth > 0) {
      const largura = Math.min(960, video.videoWidth);
      canvas.width = largura;
      canvas.height = Math.round(video.videoHeight * (largura / video.videoWidth));
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise((ok) => canvas.toBlob(ok, "image/jpeg", 0.75));
      try {
        const r = await fetch(`/api/celular/${encodeURIComponent(token)}/quadro`, {
          method: "POST", body: blob, headers: { "Content-Type": "image/jpeg" },
        });
        if (r.ok) {
          enviados += 1;
          mostrar("enviando", `Enviando · ${enviados} ${enviados === 1 ? "quadro" : "quadros"}`);
        } else if (r.status === 404) {
          mostrar("erro", "A câmera está parada no painel. Inicie o monitoramento.");
        }
      } catch (_) {
        mostrar("erro", "Sem conexão com o servidor. Tentando de novo…");
      }
    }
    // Um envio por vez (sem fila) e ~5 quadros/s.
    setTimeout(enviarQuadro, 200);
  }

  botao.addEventListener("click", async () => {
    botao.disabled = true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: "environment" }, width: { ideal: 960 }, height: { ideal: 540 } },
      });
      video.srcObject = stream;
      await video.play();
      rodando = true;
      mostrar("enviando", "Conectado. Enviando…");
      enviarQuadro();
    } catch (e) {
      botao.disabled = false;
      mostrar("erro", "Câmera não liberada. Permita o acesso à câmera e tente de novo.");
    }
  });
})();
</script>
</body>
</html>
