services:
  postgres:
    image: postgres:16-alpine
    container_name: visionepi-postgres
    environment:
      POSTGRES_USER: visionepi
      POSTGRES_PASSWORD: visionepi
      POSTGRES_DB: visionepi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionepi"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: visionepi-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    command: python run.py

volumes:
  postgres_data:
