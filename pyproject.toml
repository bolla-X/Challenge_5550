[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.ruff]
line-length = 140
src = ["app", "tests"]
# Scaffolding gerado pelo Alembic: o estilo dele é o do template, não o nosso.
# app/vision/bytetrack: codigo vendorizado (supervision, MIT) no estilo do upstream.
extend-exclude = ["migrations", "app/vision/bytetrack"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
